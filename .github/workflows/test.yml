name: Test

on:
  push:
    branches: [main, bangle2-board]
  # `branches` filters the BASE of the pull request, not the head. The port's
  # feature branches target `bangle2-board` rather than `main`, so a filter of
  # [main] alone silently skips every one of them: only compliance.yml runs
  # (it has no branch filter), and its green check reads as "CI passed" while
  # nothing has been compiled. Keep `bangle2-board` here so those PRs get a
  # real build.
  pull_request:
    branches: [main, bangle2-board]

env:
  TEST_BOARD: 'qemu_gabbro'

jobs:
  changes-test:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-test: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/test.yml'
              - 'platform/**'
              - 'resources/**'
              - 'sdk/**'
              - 'src/**'
              - 'stored_apps/**'
              - 'tests/**'
              - 'tools/**'
              - 'third_party/**'
              - 'tools/waf/**'
              - 'waf'
              - 'wscript'

  build-test:
    needs: changes-test
    if: needs.changes-test.outputs.should-test == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/coredevices/pebbleos-docker:v6
    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}" 

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Configure
        run: ./waf configure --board ${{env.TEST_BOARD}}

      - name: Run tests
        # -k keeps going after a failing test so the run reports every failure,
        # not just the first. The job still fails if anything failed.
        run: ./waf test -k

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: build/test/junit.xml
          annotate_only: true
          detailed_summary: true

      - name: Store failed test images
        uses: actions/upload-artifact@v6
        if: (!cancelled())
        with:
          name: failed_test_images
          path: build/test/tests/failed/
          if-no-files-found: ignore

  test-status:
    needs: [changes-test, build-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build-test.result == 'failure' || needs.build-test.result == 'cancelled'
        run: exit 1
